name: Scrape

on:
  workflow_dispatch:
  schedule:
    # Run every day
    - cron: 36 5 * * *

jobs:
  scrape:
    name: Run Scrapers

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        ocaml-compiler:
          - "5.2.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: ${{ matrix.os != 'macos-latest' }}
          opam-repositories: |
            pin: git+https://github.com/ocaml/opam-repository#8cdfa3296d9bc7d93273f46eb2438757e4fd5cf0
          opam-disable-sandboxing: true

      - name: Install system dependencies
        run: sudo apt update && sudo apt-get install libev-dev libonig-dev libcurl4-openssl-dev

      - name: Install opam dependencies
        run: opam install --deps-only --with-test .

      - name: Build scraper
        run: |
          opam exec -- dune build tool/ood-gen/bin/scrape.exe

      - name: Run scrapers
        run: |
          opam exec -- dune exec tool/ood-gen/bin/scrape.exe planet
          opam exec -- dune exec tool/ood-gen/bin/scrape.exe video

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          title: '[scrape.yml] New OCaml blog posts and videos'
          labels: scrape
          add-paths: |
            data/video-watch.yml
            data/video-youtube.yml
            data/planet/*/*.md
          commit-message: |
            [scrape.yml] New OCaml Planet blog posts and videos
