name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON
  workflow_dispatch:

jobs:
  build:
    name: Build and test

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        ocaml-compiler:
          - "5.2.0"

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          cache-prefix: v3-ssl07-openssl4
          # Avoid the deprecated post-job Dune cache hook (it repeats opam release discovery).
          dune-cache: false
          opam-repositories: |
            pin: git+https://github.com/ocaml/opam-repository#8cdfa3296d9bc7d93273f46eb2438757e4fd5cf0
          opam-disable-sandboxing: true

      - name: Install system dependencies (Linux)
        run: sudo apt update && sudo apt-get install libev-dev libonig-dev libcurl4-openssl-dev
        if: runner.os == 'Linux'

      - name: Install system dependencies (macOS)
        run: brew update && brew install libev openssl
        if: runner.os == 'macOS'

      - name: Use SSL 0.7.0 with the OpenSSL 4 compatibility fix
        run: opam repository add ssl-fixes "file://$GITHUB_WORKSPACE/ci/opam" --this-switch --rank=1 --yes

      - name: Install opam dependencies
        run: opam install --deps-only --with-test .

      - name: Install ocamlformat
        run: opam install ocamlformat.0.26.2

      - name: Build project
        run: opam exec -- dune build @install

      - name: Run tests
        run: opam exec -- make test

#      - name: Format code
#        run: opam exec -- dune build --auto-promote @fmt
#        if: runner.os == 'Linux'
